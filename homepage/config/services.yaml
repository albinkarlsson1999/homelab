---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services

- Smart home:
    - Home Assistant:
        icon: home-assistant
        href: https://ha.lan.nut-at-home.party
        description: Smart home hub
        server: my-docker
        container: homeassistant

- Media:
    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.lan.nut-at-home.party
        description: Media server
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableUser: true
          enableMediaControl: false

- Network:
    - Pi-hole:
        icon: pi-hole
        href: https://pihole.lan.nut-at-home.party/admin
        description: DNS & ad blocking
        server: my-docker
        container: pihole
        widget:
          type: pihole
          url: http://192.168.1.10:8082
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
    - Traefik:
        icon: traefik
        href: https://traefik.lan.nut-at-home.party
        description: Reverse proxy
        server: my-docker
        container: traefik
    - UniFi:
        icon: ubiquiti-unifi
        href: https://192.168.1.1
        description: UCG Ultra
    - Cloudflare:
        icon: cloudflare
        href: https://dash.cloudflare.com/99fe0403432819b0200bf0129a0c41c5/home
        description: Dashboard

- Infrastructure:
    - Portainer:
        icon: portainer
        href: https://portainer.lan.nut-at-home.party
        description: Container management
        server: my-docker
        container: portainer
    - Portfolio:
        icon: https://albinkarlsson.dev/favicon.svg
        href: https://albinkarlsson.dev
        description: Personal portfolio status
        siteMonitor: https://albinkarlsson.dev
        statusStyle: "dot"
