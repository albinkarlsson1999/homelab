services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      # Hitta pihole och homeassistant via dess filer, inte deras dockers
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Hitta tjänster via Docker-labels, men bara de som uttryckligen slår på det
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      # Port 80 skickar alltid vidare till HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Certifikat från Let's Encrypt via Cloudflare DNS
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53
      - --api.dashboard=true
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      LAN_DOMAIN: ${LAN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/albin/server/traefik/letsencrypt:/letsencrypt
      - /home/albin/server/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${LAN_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      # Ett wildcard-certifikat för alla tjänster
      - traefik.http.routers.dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.dashboard.tls.domains[0].main=${LAN_DOMAIN}
      - traefik.http.routers.dashboard.tls.domains[0].sans=*.${LAN_DOMAIN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
