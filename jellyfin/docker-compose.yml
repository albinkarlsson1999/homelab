services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: bridge
    ports:
      - "8096:8096"
    volumes:
      - /home/albin/server/jellyfin/config:/config
      - /home/albin/server/jellyfin/cache:/cache
      - /home/albin/server/jellyfin/media:/media
    restart: unless-stopped

