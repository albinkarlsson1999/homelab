services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: Europe/Stockholm
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_webserver_port: "8082"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_misc_dnsmasq_lines: "address=/${LAN_DOMAIN}/192.168.1.10"
    volumes:
      - /home/albin/server/pihole/etc-pihole:/etc/pihole
      - /home/albin/server/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
